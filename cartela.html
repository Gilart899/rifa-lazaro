<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Escolha seus números</title></head><body><main>
<section class="hero"><div class="clover">🍀</div><h1>ESCOLHA SUA SORTE</h1><p>Escolha seus números de 000 a 999.</p></section>
<section class="glass"><div style="display:flex;gap:8px;align-items:center"><button class="btn" id="prev">←</button><h2 id="titulo" style="flex:1;text-align:center">CARTELA 01</h2><button class="btn" id="next">→</button></div><p style="text-align:center">Arraste para os lados ou use os botões.</p><div id="grid" style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px"></div><p id="mensagemDisponibilidade" style="text-align:center;margin-top:12px">Carregando números...</p><p>Selecionados: <b id="sel">Nenhum</b></p><p>Total: <b id="total">R$ 0,00</b></p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="sugerir">🍀 SUGERIR UM NÚMERO</button><button class="btn" id="continuar">CONTINUAR →</button></div></section>
<section class="glass"><h2>🔎 Já sabe o número?</h2><input id="numero" inputmode="numeric" maxlength="3" placeholder="Ex.: 750"><button class="btn" id="ir">IR PARA O NÚMERO</button></section>
<section class="glass card-navegacao-raspadinha"><h2>💚 Raspadinha da Amizade</h2><p>Depois da confirmação da participação, sua raspadinha poderá ser liberada.</p><button class="btn" type="button" onclick="location.href='index.html'">← VOLTAR</button></section>
</main><script type="module" src="cartela.js"></script></body></html>

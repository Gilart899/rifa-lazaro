<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css">
<title>Reserva | Rifa Entre Amigos</title>
</head>
<body>
<main>
<section class="glass">
<h1>✅ Confirmar participação</h1>
<div id="nums">Carregando...</div>
<input id="nome" autocomplete="name" placeholder="Seu nome">
<input id="fone" inputmode="tel" autocomplete="tel" placeholder="WhatsApp">
<p>⏱️ Seus números ficarão reservados por <strong>30 minutos</strong>.</p>
<button class="btn" id="confirmar" type="button">CONFIRMAR RESERVA</button>
<p id="msg" aria-live="polite"></p>
</section>
</main>
<script type="module" src="reserva.js"></script>
</body>
</html>
